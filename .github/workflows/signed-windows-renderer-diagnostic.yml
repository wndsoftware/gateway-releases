name: Signed Windows configuration renderer diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderer:
    if: github.repository == 'wndsoftware/gateway-releases' && github.repository_id == '1456635236' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Authenticate, install and probe the signed runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: "444545398"
          ASSET_ID: "744587910"
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh api "repos/wndsoftware/gateway-releases/releases/$env:DRAFT_ID"
          if ($LASTEXITCODE -ne 0) { throw 'The repository token could not read the draft.' }
          $release = $releaseJson | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { "$($_.id)" -ceq $env:ASSET_ID })
          if (!$release.draft -or !$release.prerelease -or "$($release.id)" -cne $env:DRAFT_ID -or $asset.Count -ne 1 -or $asset[0].size -ne 16052224) {
            throw 'The approved asset is missing from the unpublished release.'
          }
          $msi = Join-Path $env:RUNNER_TEMP 'wnd-gateway-setup.msi'
          $curl = Join-Path ([Environment]::GetFolderPath('System')) 'curl.exe'
          # curl keeps Authorization on the original host when following redirects.
          & $curl --fail --silent --show-error --location --max-time 90 --proto '=https' --proto-redir '=https' `
            -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:GH_TOKEN" `
            --output $msi "https://api.github.com/repos/wndsoftware/gateway-releases/releases/assets/$env:ASSET_ID"
          if ($LASTEXITCODE -ne 0) { throw 'The repository token could not fetch the draft asset.' }
          Remove-Item Env:GH_TOKEN
          function Assert-SignedFile($Path, $Digest) {
            if ((Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash -ine $Digest) { throw 'The asset digest differs from the approved bytes.' }
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ine 'A4D92C21835F23E14DAFEFE4A660E3E398F1E4F7') {
              throw 'The file publisher differs from the approved WND publisher.'
            }
          }
          Assert-SignedFile $msi '09270a80761f7953f8b3ef021bca3579c76814f09dd43b0dbace6520438a06b8'
          $system = [Environment]::GetFolderPath('System')
          $install = Start-Process -FilePath (Join-Path $system 'msiexec.exe') -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Signed MSI install failed.' }
          $files = [Environment]::GetFolderPath('ProgramFiles')
          $data = [Environment]::GetFolderPath('CommonApplicationData')
          $stage = Join-Path $files 'WND Software\Gateway Setup\staging\1.0.542'
          $helper = Join-Path $stage 'Install-WNDGatewayVirtualService.ps1'
          $receipt = 'd4665026c41324cf61427b114379dc44c027ef35a314eb3f5ce9c171fb5010ed'
          if ((Get-FileHash (Join-Path $stage 'release-integrity.json')).Hash -ine $receipt -or
              (Get-FileHash $helper).Hash -ine '90fde0985dcd7ebc4580c760cf2ba920f1fe8d0c751c4d8f46bca6064f6cc56e') {
            throw 'The installed helper or receipt differs from approved bytes.'
          }
          $runtimeDigest = 'a628848a6de4330d2a34270e6d68a797b0157cb005ef072b9d7bb224acba9858'
          Assert-SignedFile (Join-Path $stage 'wnd-gateway.exe') $runtimeDigest
          $id = [guid]::NewGuid().ToString('N')
          function Invoke-Restricted($Label, $Executable, $Arguments, $Timeout) {
            $start = [Diagnostics.ProcessStartInfo]::new($Executable)
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $system
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.RedirectStandardInput = $true
            $start.Environment.Clear()
            $start.Environment['SystemRoot'] = Split-Path $system
            $start.Environment['WINDIR'] = Split-Path $system
            $start.Environment['PATH'] = $system
            $start.Environment['PSModulePath'] = Join-Path $system 'WindowsPowerShell\v1.0\Modules'
            foreach ($arg in $Arguments) { $start.ArgumentList.Add($arg) }
            $process = [Diagnostics.Process]::Start($start)
            $process.StandardInput.Close()
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (!$process.WaitForExit($Timeout)) { $process.Kill($true); throw "$Label timed out." }
            $status = '{0:x8}' -f $process.ExitCode
            Write-Host "${Label}_exit=$($process.ExitCode) ${Label}_status=0x$status"
            $rawError = $stderr.GetAwaiter().GetResult()
            $diagnostics = ($rawError -replace [regex]::Escape($id), '[installation]' -replace [regex]::Escape($env:USERPROFILE), '[profile]') -replace '[^\x20-\x7E\r\n]', ''
            if ($diagnostics) {
              $diagnostics.Substring(0, [Math]::Min($diagnostics.Length, 2000)).Split("`n") |
                ForEach-Object { Write-Host "$Label | $_" }
            }
            return $process.ExitCode
          }
          $powershell = Join-Path $system 'WindowsPowerShell\v1.0\powershell.exe'
          $helperArgs = @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', $helper,
            '-ManagedVersion', '1.0.542', '-ManagedReceiptSha256', $receipt, '-InstallationId', $id,
            '-ManagedProgramFiles', $files, '-ManagedProgramData', $data)
          $helperExit = Invoke-Restricted 'helper' $powershell $helperArgs 120000
          $protected = Join-Path $data 'WND Gateway Protected'
          $intent = Test-Path -LiteralPath (Join-Path $protected 'config\on-prem-installation.txt') -PathType Leaf
          $config = Test-Path -LiteralPath (Join-Path $protected 'config\gateway.toml') -PathType Leaf
          $runtime = Join-Path $files "WND Software\WND Gateway\runtime\$receipt\wnd-gateway.exe"
          $runtimeExists = Test-Path -LiteralPath $runtime -PathType Leaf
          "intent=$intent config=$config protected_runtime=$runtimeExists"
          if (!$runtimeExists) { throw 'The helper did not copy the signed runtime.' }
          Assert-SignedFile $runtime $runtimeDigest
          # Compare the native call in Windows PowerShell 5.1 with direct
          # process creation, with the same file and disposable identity.
          $rendererScript = @'
          param([string]$Candidate,[string]$Installation)
          $ErrorActionPreference = 'Stop'
          [Console]::Error.WriteLine("native_before=$LASTEXITCODE")
          try {
            $rendered = & $Candidate managed-setup-base-config --installation-id $Installation
            $native = $LASTEXITCODE
            [Console]::Error.WriteLine("native_after=$native lines=$(@($rendered).Count)")
            if ($null -eq $native) { exit 125 }
            exit $native
          } catch {
            [Console]::Error.WriteLine("native_error_id=$($_.FullyQualifiedErrorId)")
            [Console]::Error.WriteLine($_.Exception.Message)
            exit 126
          }
          '@
          $probePath = Join-Path $env:RUNNER_TEMP 'probe-powershell-renderer.ps1'
          Set-Content -LiteralPath $probePath -Value $rendererScript -Encoding ascii
          $nativeArgs = @('-NoLogo','-NoProfile','-NonInteractive','-File',$probePath,$runtime,$id)
          $nativeExit = Invoke-Restricted 'powershell_renderer' $powershell $nativeArgs 60000
          $rendererExit = Invoke-Restricted 'protected_renderer' $runtime @('managed-setup-base-config', '--installation-id', $id) 60000
          if ($helperExit -ne 0 -or $nativeExit -ne 0 -or $rendererExit -ne 0) { exit 1 }
